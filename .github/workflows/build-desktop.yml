name: Build RangeLab desktop apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'firmware/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/build-desktop.yml'

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the embedded phone UI is up to date
        run: npm run mobile:embed:check
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # WiFi bridge transport (https://github.com/Links2004/arduinoWebSockets)
          arduino-cli lib install "WebSockets"
      - run: |
          # arduino-cli requires the sketch folder to match the .ino name
          mkdir -p sketch/RangeLab_ESP32
          cp firmware/RangeLab_ESP32.ino firmware/web_assets.h sketch/RangeLab_ESP32/
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build sketch/RangeLab_ESP32 --warnings default
      - uses: actions/upload-artifact@v4
        with:
          name: RangeLab-firmware-esp32
          path: build/*.bin
          if-no-files-found: error
          retention-days: 14

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: npm install
      - run: npm test
      # macOS signing and notarization. Only exported when the secrets exist,
      # because empty env vars make Tauri attempt a signing/notarization that fails.
      - name: Configure Apple signing (optional)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            { echo 'APPLE_CERTIFICATE<<CERT_EOF'; echo "$APPLE_CERTIFICATE"; echo 'CERT_EOF'; } >> "$GITHUB_ENV"
            { echo 'APPLE_CERTIFICATE_PASSWORD<<PWD_EOF'; echo "$APPLE_CERTIFICATE_PASSWORD"; echo 'PWD_EOF'; } >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: RangeLab-${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

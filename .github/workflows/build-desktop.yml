name: Build RangeLab desktop apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'firmware/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/build-desktop.yml'

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publish the merged image as a release asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the embedded phone UI is up to date
        run: npm run mobile:embed:check
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # WiFi bridge transport (https://github.com/Links2004/arduinoWebSockets)
          arduino-cli lib install "WebSockets"
      - name: Compile firmware
        shell: bash
        run: |
          # arduino-cli requires the sketch folder to match the .ino name
          mkdir -p sketch/RangeLab_ESP32
          cp firmware/RangeLab_ESP32.ino firmware/web_assets.h sketch/RangeLab_ESP32/
          set +e
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build sketch/RangeLab_ESP32 --warnings default 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the real compiler errors as run annotations: job logs need
            # repository admin, annotations are readable by anyone who can see the repo.
            grep -E 'error:|undefined reference|too big|multiple definition|fatal error' compile.log \
              | head -12 | cut -c1-300 \
              | while IFS= read -r line; do echo "::error title=firmware compile::${line//$'\n'/ }"; done
            { echo '### Firmware compile failed'; echo '```'; tail -25 compile.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          tail -3 compile.log | grep -E 'Sketch uses|Global variables' || true
      # The published build has the rail tap and the supervisor input compiled
      # out, so those blocks are otherwise never type-checked. Build them here
      # too: a feature that is never compiled is never proven to compile.
      - name: Compile the optional rail and supervisor paths
        shell: bash
        run: |
          set -e
          sed -i 's/#define RANGELAB_RAIL_ADC -1/#define RANGELAB_RAIL_ADC 34/; s/#define RANGELAB_PWRGOOD_PIN -1/#define RANGELAB_PWRGOOD_PIN 35/' sketch/RangeLab_ESP32/RangeLab_ESP32.ino
          # If a rename ever stops the sed matching, fail here rather than
          # silently type-check a build where both features are still off.
          grep -q '#define RANGELAB_RAIL_ADC 34' sketch/RangeLab_ESP32/RangeLab_ESP32.ino
          grep -q '#define RANGELAB_PWRGOOD_PIN 35' sketch/RangeLab_ESP32/RangeLab_ESP32.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 sketch/RangeLab_ESP32 --warnings default
      - uses: actions/upload-artifact@v4
        with:
          name: RangeLab-firmware-esp32
          path: build/*.bin
          if-no-files-found: error
          retention-days: 14
      # Artifacts are always delivered zipped. A release asset downloads as the
      # bare file, which is what you want when the only step left is flashing it.
      - name: Publish the merged image as a release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: firmware-${{ github.ref_name }}
        run: |
          cp build/*.merged.bin RangeLab-ESP32-firmware.bin
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "RangeLab firmware — ${{ github.ref_name }}" \
            --notes "Single merged image, flash at 0x0. Built from ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --prerelease
          gh release upload "$TAG" RangeLab-ESP32-firmware.bin --clobber
          echo "Download: ${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/RangeLab-ESP32-firmware.bin"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust_target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: npm install
      - run: npm test
      # macOS signing and notarization. Only exported when the secrets exist,
      # because empty env vars make Tauri attempt a signing/notarization that fails.
      - name: Configure Apple signing (optional)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            { echo 'APPLE_CERTIFICATE<<CERT_EOF'; echo "$APPLE_CERTIFICATE"; echo 'CERT_EOF'; } >> "$GITHUB_ENV"
            { echo 'APPLE_CERTIFICATE_PASSWORD<<PWD_EOF'; echo "$APPLE_CERTIFICATE_PASSWORD"; echo 'PWD_EOF'; } >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: RangeLab-${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}
          path: src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14
